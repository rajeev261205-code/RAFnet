services:
  - type: web
    name: rafnet-backend
    plan: standard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: RAFNET_ENV
        value: "production"
      - key: SOC_REQUIRE_AUTH
        value: "true"
      - key: MOCK_INFERENCE
        value: "false"
      - key: RAFNET_DEVICE
        value: "cpu"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOC_CORS_ORIGINS
        sync: false
